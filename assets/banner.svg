<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Zoha Khawaja — Machine Learning and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04050b"/>
      <stop offset="0.45" stop-color="#070917"/>
      <stop offset="1" stop-color="#0b0620"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
      <animate attributeName="x1" values="-1;0;-1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#ffffff" opacity="0.05"/>
    </pattern>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#7c3aed" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <circle cx="150" cy="60" r="250" fill="url(#glowPurple)">
    <animate attributeName="r" values="230;270;230" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="270" r="270" fill="url(#glowCyan)">
    <animate attributeName="r" values="250;290;250" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- neural constellation -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.35">
    <line x1="905" y1="86" x2="992" y2="66"/>
    <line x1="992" y1="66" x2="1078" y2="112"/>
    <line x1="905" y1="86" x2="942" y2="162"/>
    <line x1="942" y1="162" x2="1040" y2="178"/>
    <line x1="992" y1="66" x2="942" y2="162"/>
    <line x1="1078" y1="112" x2="1040" y2="178"/>
    <line x1="942" y1="162" x2="978" y2="242"/>
    <line x1="1040" y1="178" x2="1088" y2="232"/>
    <line x1="1078" y1="112" x2="1128" y2="78"/>
    <line x1="978" y1="242" x2="1088" y2="232"/>
    <line x1="905" y1="86" x2="902" y2="222"/>
    <line x1="902" y1="222" x2="978" y2="242"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="905" cy="86" r="3.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="992" cy="66" r="3.4"><animate attributeName="opacity" values="1;0.35;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1078" cy="112" r="3"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#c084fc">
    <circle cx="942" cy="162" r="4.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="178" r="3.6"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="978" cy="242" r="3.4"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1088" cy="232" r="3.8"><animate attributeName="opacity" values="0.45;1;0.45" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="902" cy="222" r="3"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1128" cy="78" r="3.2"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- rising particles -->
  <g fill="#67e8f9">
    <circle cx="220" cy="270" r="1.8"><animate attributeName="cy" values="270;120" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="280" r="1.4"><animate attributeName="cy" values="280;140" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="260" r="1.6"><animate attributeName="cy" values="260;110" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.65;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="285" r="1.3"><animate attributeName="cy" values="285;150" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="275" r="1.7"><animate attributeName="cy" values="275;120" dur="8.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#c4b5fd">
    <circle cx="120" cy="240" r="1.4"><animate attributeName="cy" values="240;100" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="9.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="230" r="1.2"><animate attributeName="cy" values="230;90" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.55;0" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="250" r="1.3"><animate attributeName="cy" values="250;110" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="265" r="1.5"><animate attributeName="cy" values="265;130" dur="8.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- waves -->
  <g opacity="0.9">
    <path d="M-200 300 Q 100 250 400 300 T 1000 300 T 1600 300" fill="none" stroke="url(#waveA)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;-200 0;0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 312 Q 150 268 450 312 T 1050 312 T 1650 312" fill="none" stroke="url(#waveB)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;220 0;0 0" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 292 Q 120 258 420 292 T 1020 292 T 1620 292" fill="none" stroke="url(#waveC)" stroke-width="1.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-160 0;0 0" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- top animated accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- name block -->
  <text x="80" y="146" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="1.5" fill="url(#nameGrad)" filter="url(#glow)">Zoha Khawaja</text>
  <text x="83" y="190" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="1.2" fill="url(#accent)" filter="url(#softGlow)">Machine Learning · AI Engineering · Python</text>
  <text x="84" y="224" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="0.6" fill="#8b96c4">BS Software Engineering · Computer Vision · Generative AI · Data Science</text>

  <rect x="84" y="248" width="150" height="3.5" rx="1.75" fill="url(#accent)">
    <animate attributeName="width" values="110;210;110" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="84" cy="272" r="3" fill="#22d3ee"><animate attributeName="cx" values="84;234;84" dur="6s" repeatCount="indefinite"/></circle>
</svg>
