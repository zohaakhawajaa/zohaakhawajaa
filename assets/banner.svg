<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1180 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Zoha Khawaja — Machine Learning and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="0.5" stop-color="#0a1130"/>
      <stop offset="1" stop-color="#0c0722"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1180" height="300" fill="url(#bg)"/>
  <rect width="1180" height="300" fill="url(#grid)"/>
  <circle cx="150" cy="55" r="220" fill="url(#glow1)"/>
  <circle cx="1040" cy="255" r="240" fill="url(#glow2)"/>
  <rect x="0" y="0" width="1180" height="4" fill="url(#stroke)"/>

  <text x="70" y="132" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="1">Zoha Khawaja</text>
  <text x="72" y="177" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="url(#stroke)" letter-spacing="0.5">Machine Learning · AI Engineering · Python</text>
  <text x="72" y="219" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#8b9ac4" letter-spacing="0.5">BS Software Engineering · Computer Vision · Generative AI · Data Science</text>
  <rect x="72" y="243" width="130" height="4" rx="2" fill="url(#stroke)"/>
</svg>
