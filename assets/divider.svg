<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 24" preserveAspectRatio="xMidYMid meet" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0;-1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="dglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#dline)" stroke-width="1.5"/>
  <circle cx="600" cy="12" r="34" fill="url(#dglow)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(600 12)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#0b0620" stroke="#c084fc" stroke-width="1.5" transform="rotate(45)">
      <animate attributeName="stroke" values="#22d3ee;#a855f7;#22d3ee" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="552" cy="12" r="2.4" fill="#22d3ee" opacity="0.85"/>
  <circle cx="648" cy="12" r="2.4" fill="#c084fc" opacity="0.85"/>
</svg>
